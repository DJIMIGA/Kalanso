[project]
name = "kalanso"
version = "0.1.0"
description = "Kalanso : gestion scolaire pour les groupes scolaires du Mali (serveur local + cloud)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "django>=5.2,<5.3",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "kalanso.settings.dev"
python_files = ["tests.py", "test_*.py"]
addopts = "-ra --strict-markers"
testpaths = ["kalanso", "core", "accounts"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S"]
ignore = ["S101"]  # assert est normal dans les tests

[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S105", "S106"]  # mots de passe de test en dur
"**/test_*.py" = ["S105", "S106"]
